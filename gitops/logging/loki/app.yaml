# Loki in single binary mode, storing chunks and index in the S3 bucket from 1_infra.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: loki
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: loki
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      sources:
        - repoURL: https://grafana.github.io/helm-charts
          chart: loki
          targetRevision: 7.5.0
          helm:
            releaseName: loki
            valueFiles:
              - $values/gitops/logging/loki/values.yaml
              - $values/gitops/logging/loki/values-{{ .metadata.labels.environment }}.yaml
            valuesObject:
              loki:
                storage:
                  bucketNames:
                    chunks: "{{ .metadata.annotations.loki_bucket }}"
                    ruler: "{{ .metadata.annotations.loki_bucket }}"
                    admin: "{{ .metadata.annotations.loki_bucket }}"
                  s3:
                    region: "{{ .metadata.annotations.aws_region }}"
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: "{{ .metadata.annotations.loki_role_arn }}"
        - repoURL: "{{ .metadata.annotations.gitops_repo_url }}"
          targetRevision: "{{ .metadata.annotations.gitops_revision }}"
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: logging
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
