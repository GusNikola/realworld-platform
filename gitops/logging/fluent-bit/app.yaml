# Fluent Bit DaemonSet shipping container logs from every node to Loki.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: fluent-bit
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      sources:
        - repoURL: https://fluent.github.io/helm-charts
          chart: fluent-bit
          targetRevision: 0.58.3
          helm:
            releaseName: fluent-bit
            valueFiles:
              - $values/gitops/logging/fluent-bit/values.yaml
              - $values/gitops/logging/fluent-bit/values-{{ .metadata.labels.environment }}.yaml
        - repoURL: "{{ .metadata.annotations.gitops_repo_url }}"
          targetRevision: "{{ .metadata.annotations.gitops_revision }}"
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: logging
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
