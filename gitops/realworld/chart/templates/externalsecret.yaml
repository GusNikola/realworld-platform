# Backend secrets: application keys plus the RDS master credentials. Reloader restarts
# the backend when RDS rotates the password and this Secret is refreshed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: realworld-backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: realworld-backend
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: {{ required "secrets.backend is required" .Values.secrets.backend }}
        property: JWT_SECRET_KEY
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ .Values.secrets.backend }}
        property: SECRET_KEY
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ required "secrets.rds is required" .Values.secrets.rds }}
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.rds }}
        property: password
