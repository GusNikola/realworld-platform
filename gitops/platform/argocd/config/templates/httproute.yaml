apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - {{ required "host is required" .Values.host | quote }}
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
