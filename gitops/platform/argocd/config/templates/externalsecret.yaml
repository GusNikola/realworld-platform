# Adds the GitHub webhook secret to argocd-secret, which the argo-cd chart owns.
# Merge keeps the keys the chart manages and only writes webhook.github.secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: {{ required "webhookSecretName is required" .Values.webhookSecretName }}
