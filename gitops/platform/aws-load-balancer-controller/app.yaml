apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: aws-load-balancer-controller
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
    spec:
      project: default
      sources:
        - repoURL: https://aws.github.io/eks-charts
          chart: aws-load-balancer-controller
          targetRevision: 3.6.2
          helm:
            releaseName: aws-load-balancer-controller
            valueFiles:
              - $values/gitops/platform/aws-load-balancer-controller/values.yaml
              - $values/gitops/platform/aws-load-balancer-controller/values-{{ .metadata.labels.environment }}.yaml
            valuesObject:
              clusterName: "{{ .metadata.annotations.cluster_name }}"
              region: "{{ .metadata.annotations.aws_region }}"
              vpcId: "{{ .metadata.annotations.vpc_id }}"
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: "{{ .metadata.annotations.lbc_role_arn }}"
        - repoURL: "{{ .metadata.annotations.gitops_repo_url }}"
          targetRevision: "{{ .metadata.annotations.gitops_revision }}"
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
