replicaCount: 2

serviceAccount:
  create: true
  name: aws-load-balancer-controller

controllerConfig:
  featureGates:
    ALBGatewayAPI: true
    NLBGatewayAPI: false

nodeSelector:
  eks.amazonaws.com/nodegroup: system

tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoSchedule
