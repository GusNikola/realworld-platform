# External Secrets Operator and the ClusterSecretStore for AWS Secrets Manager.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: external-secrets
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: default
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 2.14.0
          helm:
            releaseName: external-secrets
            valueFiles:
              - $values/gitops/platform/external-secrets/values.yaml
              - $values/gitops/platform/external-secrets/values-{{ .metadata.labels.environment }}.yaml
            valuesObject:
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: "{{ .metadata.annotations.external_secrets_role_arn }}"
        - repoURL: "{{ .metadata.annotations.gitops_repo_url }}"
          targetRevision: "{{ .metadata.annotations.gitops_revision }}"
          ref: values
        - repoURL: "{{ .metadata.annotations.gitops_repo_url }}"
          targetRevision: "{{ .metadata.annotations.gitops_revision }}"
          path: gitops/platform/external-secrets/config
          helm:
            releaseName: external-secrets-config
            valueFiles:
              - values.yaml
              - values-{{ .metadata.labels.environment }}.yaml
            valuesObject:
              region: "{{ .metadata.annotations.aws_region }}"
      destination:
        server: "{{ .server }}"
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
