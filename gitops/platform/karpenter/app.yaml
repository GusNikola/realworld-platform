# Karpenter controller (on the system node group) plus its EC2NodeClass and NodePool,
# which provision the nodes for observability and the application.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: karpenter
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
    spec:
      project: default
      sources:
        - repoURL: public.ecr.aws/karpenter
          chart: karpenter
          targetRevision: 1.15.1
          helm:
            releaseName: karpenter
            valueFiles:
              - $values/gitops/platform/karpenter/values.yaml
              - $values/gitops/platform/karpenter/values-{{ .metadata.labels.environment }}.yaml
            valuesObject:
              settings:
                clusterName: "{{ .metadata.annotations.cluster_name }}"
                interruptionQueue: "{{ .metadata.annotations.karpenter_queue_name }}"
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: "{{ .metadata.annotations.karpenter_role_arn }}"
        - repoURL: "{{ .metadata.annotations.gitops_repo_url }}"
          targetRevision: "{{ .metadata.annotations.gitops_revision }}"
          ref: values
        - repoURL: "{{ .metadata.annotations.gitops_repo_url }}"
          targetRevision: "{{ .metadata.annotations.gitops_revision }}"
          path: gitops/platform/karpenter/config
          helm:
            releaseName: karpenter-config
            valueFiles:
              - values.yaml
              - values-{{ .metadata.labels.environment }}.yaml
            valuesObject:
              clusterName: "{{ .metadata.annotations.cluster_name }}"
              nodeRoleName: "{{ .metadata.annotations.karpenter_node_role_name }}"
      destination:
        server: "{{ .server }}"
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
