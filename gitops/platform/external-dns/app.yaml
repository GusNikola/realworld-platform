# ExternalDNS creates Route53 records for HTTPRoute hostnames attached to the public Gateway.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: external-dns
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: default
      sources:
        - repoURL: https://kubernetes-sigs.github.io/external-dns/
          chart: external-dns
          targetRevision: 1.23.0
          helm:
            releaseName: external-dns
            valueFiles:
              - $values/gitops/platform/external-dns/values.yaml
              - $values/gitops/platform/external-dns/values-{{ .metadata.labels.environment }}.yaml
            valuesObject:
              domainFilters:
                - "{{ .metadata.annotations.domain }}"
              txtOwnerId: "realworld-{{ .metadata.labels.environment }}"
              extraArgs:
                - --zone-id-filter={{ .metadata.annotations.hosted_zone_id }}
                - --aws-zone-type=public
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: "{{ .metadata.annotations.external_dns_role_arn }}"
        - repoURL: "{{ .metadata.annotations.gitops_repo_url }}"
          targetRevision: "{{ .metadata.annotations.gitops_revision }}"
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: external-dns
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
