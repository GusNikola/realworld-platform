# EKS does not expose these control plane components to Prometheus.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    # Pick up ServiceMonitors and PodMonitors from every namespace, not only this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi

# Alerts are only shown in Grafana for now; no notification receivers are configured.
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi

grafana:
  admin:
    # Synced from AWS Secrets Manager by the ExternalSecret in config/.
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  grafana.ini:
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.logging.svc.cluster.local
      access: proxy
