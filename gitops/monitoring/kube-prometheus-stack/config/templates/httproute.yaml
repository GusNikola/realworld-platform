apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - {{ required "grafanaHost is required" .Values.grafanaHost | quote }}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
